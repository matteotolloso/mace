# MACE hyperparameters: identical to B (ani1x-system/mace-mve/lf-to-hf) except mve_beta_nll.
# Data files, output directories, --wandb_dir and --foundation_model are passed by
# `uq train-member` (uq/training/launch.py); see docs/experiments.md.
model: "MACE"

multiheads_finetuning: False

name: "mace"

energy_key: "ccsd(t)_cbs.energy"

lr: 0.001 # 1/10 of the learning rate used in experiment A, since we are fine-tuning
num_channels: 128
max_L: 1
r_max: 6.0
forces_weight: 0.0
device: cuda
batch_size: 64
max_num_epochs: 100
swa: False
compute_forces: False
E0s: "average"
predict_mve: True
loss: "gaussian_nll"
# WP3.3 ablation: beta-NLL (Seitzer et al. 2022), each configuration's NLL gradient weighted by
# stop_grad(variance)**0.5; the loss value, hence validation loss and checkpoint selection, is still the
# Gaussian NLL (mace/modules/loss.py, weighted_gaussian_nll_energy).
mve_beta_nll: 0.5
eval_interval: 1
save_all_checkpoints: True
log_epoch_outputs: False
default_dtype: "float32"
enable_cueq: False

wandb: True
wandb_entity: "uq-mf"
wandb_project: "ani1x-system_mace-mve_lf-to-hf-beta-nll"
