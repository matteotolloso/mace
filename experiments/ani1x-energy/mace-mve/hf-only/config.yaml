# MACE hyperparameters of this experiment (legacy experiment_F/config_F.yml).
# Data files, output directories, --wandb_dir and --foundation_model are passed by
# `uq train-member` (uq/training/launch.py); see docs/experiments.md.
model: "MACE"

name: "mace"

energy_key: "ccsd(t)_cbs.energy"

lr: 0.01
num_channels: 128
max_L: 1
r_max: 6.0
forces_weight: 0.0
device: cuda
batch_size: 64
max_num_epochs: 300
swa: False
compute_forces: False
E0s: "average"
predict_mve: True
loss: "gaussian_nll"
eval_interval: 1
save_all_checkpoints: True
log_epoch_outputs: False
default_dtype: "float32"
enable_cueq: False

wandb: True
wandb_entity: "uq-mf"
wandb_project: "experiment_F"   # W&B project name from before the 2026-09 rename (kept for continuity)
