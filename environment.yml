# Conda environment that produced the ICLR27 results (exported 2026-09-26 with
# `conda env export --no-builds`; install prefix and the self-referencing mace-torch pin removed).
#   conda env create -f environment.yml && conda activate mace
#   pip install --no-deps --no-build-isolation -e .   # this repository: MACE fork + the uq package
# aseMolec (not on PyPI, unused by uq/ and mace/) removed 2026-11-06 so the env builds on Leonardo.
# Exact pins favour reproducing old numbers; for a newer stack, start from setup.cfg instead.
name: mace
